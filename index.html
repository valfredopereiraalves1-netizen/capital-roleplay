<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071321">
<meta name="description" content="Capital Roleplay — acesse o portal oficial da comunidade.">
<title>Capital Roleplay | Bem-vindo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--display:"Bebas Neue",Impact,sans-serif}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0}
body{min-height:100svh;overflow:hidden;background:#071321;color:#fff;font-family:Inter,Arial,sans-serif}
.entry{position:relative;isolation:isolate;display:grid;place-items:center;min-height:100svh;padding:32px 22px;overflow:hidden;background:linear-gradient(110deg,rgba(3,10,19,.78),rgba(4,15,28,.48) 52%,rgba(3,10,19,.78))}
.backdrop{position:absolute;z-index:-3;inset:-5%;background-image:url("file_00000000ef14820eb7d37f862d184d27.png");background-size:cover;background-position:center;background-repeat:no-repeat;transform:scale(1.08);animation:cinematic-pan 26s ease-in-out infinite alternate;will-change:transform}
.entry:before{content:"";position:absolute;z-index:-2;inset:0;background:linear-gradient(110deg,rgba(3,10,19,.84),rgba(5,19,35,.5) 48%,rgba(3,10,19,.78)),linear-gradient(0deg,rgba(2,8,15,.5),transparent 55%);pointer-events:none}
.entry:after{content:"";position:absolute;z-index:2;inset:18px;border:1px solid rgba(220,236,255,.17);pointer-events:none}
.grid{position:absolute;z-index:-1;inset:0;opacity:.13;background-image:linear-gradient(rgba(180,215,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(180,215,255,.12) 1px,transparent 1px);background-size:72px 72px;mask-image:radial-gradient(ellipse at center,#000,transparent 78%)}
.light-sweep{position:absolute;z-index:0;top:-40%;bottom:-40%;left:-45%;width:26%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(166,211,255,.06) 28%,rgba(111,180,255,.2) 50%,rgba(220,239,255,.08) 72%,transparent);filter:blur(20px);transform:skewX(-18deg);animation:sweep 11s linear infinite}
.pulse-orb{position:absolute;z-index:0;width:5px;height:5px;border-radius:50%;background:#d9edff;box-shadow:0 0 12px 4px rgba(72,157,255,.55),0 0 34px 10px rgba(45,140,255,.22);opacity:.65;pointer-events:none;animation:float 8s ease-in-out infinite}
.pulse-orb.one{top:22%;left:14%}
.pulse-orb.two{right:16%;bottom:24%;width:4px;height:4px;animation-delay:-4s}
.glow-ring{position:absolute;z-index:-1;width:min(76vw,720px);aspect-ratio:1;border:1px solid rgba(205,230,255,.13);border-radius:50%;box-shadow:0 0 0 36px rgba(205,230,255,.025),0 0 0 76px rgba(205,230,255,.016),inset 0 0 100px rgba(45,140,255,.1);animation:ring 14s ease-in-out infinite}
.content{position:relative;z-index:1;width:min(780px,100%);text-align:center;animation:arrive 1.1s cubic-bezier(.2,.7,.2,1) both}
.kicker{display:inline-flex;align-items:center;gap:13px;margin:0 0 24px;color:#c6e1ff;font-size:10px;font-weight:800;letter-spacing:.34em;text-transform:uppercase}
.kicker:before,.kicker:after{content:"";width:38px;height:1px;background:linear-gradient(90deg,transparent,#70b6ff)}
.kicker:after{transform:rotate(180deg)}
h1{margin:0;font-family:var(--display);font-size:clamp(66px,12vw,138px);font-weight:400;line-height:.82;letter-spacing:.035em;text-shadow:0 12px 48px rgba(0,0,0,.65)}
h1 span{display:block;margin-top:13px;color:#e8f3ff;text-shadow:0 0 34px rgba(67,157,255,.32),0 12px 48px rgba(0,0,0,.55)}
.subtitle{margin:30px auto 0;color:rgba(230,241,255,.82);font-size:clamp(11px,1.5vw,13px);font-weight:600;letter-spacing:.24em;text-transform:uppercase}
.enter{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:16px;min-width:224px;min-height:60px;margin-top:46px;padding:0 32px;overflow:hidden;border:1px solid rgba(199,226,255,.62);border-radius:4px;background:linear-gradient(110deg,#1457a0,#247ed2 55%,#174b86);box-shadow:0 12px 42px rgba(20,103,185,.28),inset 0 1px rgba(255,255,255,.22);color:#fff;font:800 11px Inter,Arial,sans-serif;letter-spacing:.22em;text-decoration:none;text-transform:uppercase;transition:transform .3s ease,box-shadow .3s ease,filter .3s ease}
.enter:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 18%,rgba(255,255,255,.34) 48%,transparent 76%);transform:translateX(-125%);transition:transform .8s ease}
.enter:hover{transform:translateY(-4px);filter:brightness(1.12);box-shadow:0 18px 54px rgba(20,103,185,.42),0 0 34px rgba(81,164,255,.2)}
.enter:hover:before{transform:translateX(125%)}
.arrow{font-size:18px;line-height:1;transition:transform .3s ease}
.enter:hover .arrow{transform:translateX(6px)}
.footer-note{position:absolute;z-index:1;bottom:30px;left:20px;right:20px;color:rgba(221,236,255,.55);font-size:9px;font-weight:700;letter-spacing:.24em;text-align:center;text-transform:uppercase}
@keyframes cinematic-pan{0%{transform:scale(1.08) translate3d(-1.2%,-.5%,0)}100%{transform:scale(1.2) translate3d(1.2%,.8%,0)}}
@keyframes sweep{from{left:-45%}to{left:125%}}
@keyframes float{0%,100%{transform:translate3d(0,0,0) scale(.8);opacity:.28}50%{transform:translate3d(18px,-30px,0) scale(1.25);opacity:.9}}
@keyframes arrive{from{opacity:0;transform:translateY(24px);filter:blur(5px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes ring{0%,100%{transform:scale(.96);opacity:.5}50%{transform:scale(1.04);opacity:.95}}
@media(max-width:600px){.entry{padding:24px 18px}.backdrop{background-position:54% center}.entry:after{inset:10px}.glow-ring{width:110vw}.kicker{font-size:8px;letter-spacing:.23em}.kicker:before,.kicker:after{width:22px}.subtitle{max-width:290px;line-height:1.9;letter-spacing:.17em}.enter{min-width:210px;min-height:57px;margin-top:38px}.footer-note{bottom:22px;font-size:8px;letter-spacing:.15em}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.content{opacity:1;transform:none;filter:none}.backdrop{transform:scale(1.08)}}
</style>
</head>
<body>
<main class="entry">
 <div class="backdrop" aria-hidden="true"></div>
 <div class="grid" aria-hidden="true"></div>
 <div class="light-sweep" aria-hidden="true"></div>
 <div class="pulse-orb one" aria-hidden="true"></div>
 <div class="pulse-orb two" aria-hidden="true"></div>
 <div class="glow-ring" aria-hidden="true"></div>
 <section class="content" aria-label="Entrada Capital Roleplay">
  <p class="kicker">Roblox · Discord · Roleplay</p>
  <h1>CAPITAL <span>ROLEPLAY</span></h1>
  <p class="subtitle">Sua próxima história começa aqui</p>
  <a class="enter" href="portal.html">ENTRAR <span class="arrow" aria-hidden="true">→</span></a>
 </section>
 <div class="footer-note">Portal oficial · Capital Roleplay</div>
</main>
</body>
</html>
