<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0d"><title>Comunicados | Capital Roleplay</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">C</span><span>CAPITAL<small>ROLEPLAY</small></span></a><button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">☰</button><nav id="navigation"><a href="index.html">Início</a><a href="departamentos.html">Departamentos</a><a href="comunicados.html">Comunicados</a><a class="nav-cta" href="inscricoes.html">Fazer inscrição ↗</a><a href="admin.html">Administração</a></nav></header><main class="section-wrap"><div class="page-title"><div class="kicker">CENTRAL DA COMUNIDADE</div><h1>Comunicados <em>oficiais.</em></h1><p>Acompanhe avisos, novidades e atualizações publicados pela administração.</p></div><section class="page-content"><div id="announcementList" class="announcement-list"><div class="empty-state">Carregando comunicados...</div></div></section></main><footer class="site-footer"><a class="brand" href="index.html"><span class="brand-mark">C</span><span>CAPITAL<small>ROLEPLAY</small></span></a><span>© 2026 CAPITAL ROLEPLAY</span><a href="admin.html">PAINEL ADMINISTRATIVO ↗</a></footer><script>document.getElementById('menuToggle')?.addEventListener('click',()=>document.getElementById('navigation')?.classList.toggle('open'));</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>(async()=>{const c=window.CAPITAL_CONFIG||{};if(!c.supabaseUrl||!c.supabaseAnonKey||!window.supabase)return;const db=supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const {data,error}=await db.from('announcements').select('title,body,created_at').eq('published',true).order('created_at',{ascending:false}).limit(30);const list=document.getElementById('announcementList');if(error||!data?.length){list.innerHTML='<div class="empty-state">Nenhum comunicado publicado no momento.</div>';return}list.replaceChildren(...data.map(x=>{const a=document.createElement('article');a.className='announcement-item';const t=document.createElement('time');t.textContent=new Date(x.created_at).toLocaleDateString('pt-BR');const h=document.createElement('h3');h.textContent=x.title;const p=document.createElement('p');p.textContent=x.body;a.append(t,h,p);return a}))})();</script></body></html>
