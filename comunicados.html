<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><meta name="description" content="Comunicados oficiais da Capital Roleplay."><title>Comunicados | Capital Roleplay</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html" aria-label="Capital Roleplay — início"><img src="capital-roleplay-wordmark.svg" alt="Capital Roleplay"></a><button class="menu-toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false">☰</button><nav id="navigation" aria-label="Navegação principal"><a href="index.html">Início</a><a href="departamentos.html">Departamentos</a><a class="active" href="comunicados.html">Comunicados</a><a href="inscricoes.html" class="nav-cta">Inscrições</a></nav></div></header>
<main class="container interior"><header class="page-heading"><p class="eyebrow">INFORMAÇÃO OFICIAL</p><h1>Comunicados</h1><p>Avisos e atualizações publicados pela administração da Capital Roleplay.</p></header><section id="announcementList" class="announcement-list" aria-live="polite"><p class="empty-state">Carregando comunicados...</p></section></main>
<footer class="site-footer"><div class="container footer-inner"><a class="brand footer-brand" href="index.html"><img src="capital-roleplay-wordmark.svg" alt="Capital Roleplay"></a><span>© 2026 Capital Roleplay</span><a href="admin.html">Área administrativa</a></div></footer>
<script>const menu=document.getElementById('menuToggle');const nav=document.getElementById('navigation');menu?.addEventListener('click',()=>{const open=nav.classList.toggle('open');menu.setAttribute('aria-expanded',String(open));});nav?.querySelectorAll('a').forEach(link=>link.addEventListener('click',()=>{nav.classList.remove('open');menu?.setAttribute('aria-expanded','false');}));</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>(async()=>{const list=document.getElementById('announcementList');const cfg=window.CAPITAL_CONFIG||{};if(!cfg.supabaseUrl||!cfg.supabaseAnonKey||!window.supabase){list.innerHTML='<p class="empty-state">Os comunicados não estão disponíveis no momento.</p>';return;}try{const db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const {data,error}=await db.from('announcements').select('title,body,created_at').eq('published',true).order('created_at',{ascending:false}).limit(30);if(error)throw error;if(!data?.length){list.innerHTML='<p class="empty-state">Nenhum comunicado publicado.</p>';return;}list.replaceChildren(...data.map(item=>{const article=document.createElement('article');article.className='announcement-item';const date=document.createElement('time');date.dateTime=item.created_at;date.textContent=new Date(item.created_at).toLocaleDateString('pt-BR');const title=document.createElement('h2');title.textContent=item.title;const body=document.createElement('p');body.textContent=item.body;article.append(date,title,body);return article;}));}catch(e){list.innerHTML='<p class="empty-state">Não foi possível carregar os comunicados. Tente novamente mais tarde.</p>';}})();</script></body></html>
