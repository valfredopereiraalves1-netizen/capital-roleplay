<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#123d2c"><title>Painel administrativo | Capital Roleplay</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">C</span><span>CAPITAL <small>ROLEPLAY</small></span></a><a class="text-link" href="index.html">← Voltar ao site</a></header>
<main class="section-wrap" style="max-width:760px;padding-top:90px;padding-bottom:120px"><div class="section-kicker">ACESSO RESTRITO</div><h1 style="font-size:clamp(42px,7vw,68px)">Painel <em style="color:var(--gold)">administrativo.</em></h1><p style="color:var(--muted)">Entre com a conta autorizada para gerenciar inscrições e comunicados.</p>
<section class="join-panel" style="margin-top:35px"><form id="loginForm" style="display:grid;gap:16px"><label>E-mail<input name="email" type="email" required autocomplete="username" placeholder="E-mail administrativo"></label><label>Senha<input name="password" type="password" required autocomplete="current-password" placeholder="Sua senha"></label><button class="button button-gold" type="submit">Entrar no painel ↗</button><p id="loginFeedback" class="form-feedback"></p></form></section>
<section id="dashboard" hidden style="margin-top:35px"><div class="section-kicker">GESTÃO</div><h2>Inscrições recebidas</h2><div id="applicationList" class="announcement-list"></div><h2 style="margin-top:45px">Publicar comunicado</h2><form id="announcementForm" class="join-panel" style="display:grid;gap:15px"><label>Título<input name="title" required maxlength="80"></label><label>Mensagem<textarea name="body" rows="4" required maxlength="500"></textarea></label><button class="button button-gold" type="submit">Publicar comunicado</button><p id="adminFeedback" class="form-feedback"></p></form><button id="logoutButton" class="button" style="margin-top:20px;background:#28241b;color:var(--gold2)">Sair</button></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
