<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0714"><meta name="description" content="Acesso administrativo da Capital Roleplay."><title>Administração | Capital Roleplay</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html" aria-label="Capital Roleplay — início"><img src="capital-roleplay-wordmark.svg" alt="Capital Roleplay"></a><button class="menu-toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false"><svg class="ui-icon menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><nav id="navigation" aria-label="Navegação principal"><a href="index.html">Início</a><a href="departamentos.html">Departamentos</a><a href="comunicados.html">Comunicados</a><a href="inscricoes.html" class="nav-cta">Inscrições</a></nav></div></header>
<main class="container interior"><header class="page-heading"><p class="eyebrow">ACESSO RESTRITO</p><h1>Administração</h1><p>Área de gestão da comunidade. Entre com uma conta autorizada.</p></header>
<section class="admin-card"><form id="loginForm"><h2>Entrar no painel</h2><label for="email">E-mail</label><input id="email" name="email" type="email" required autocomplete="username" placeholder="Seu e-mail"><label for="password">Senha</label><input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Sua senha"><button class="button primary" type="submit">Entrar</button><p id="loginFeedback" class="form-feedback" role="status"></p></form></section>
<section id="dashboard" hidden class="dashboard"><div class="dashboard-heading"><div><p class="eyebrow">GESTÃO DA COMUNIDADE</p><h2>Inscrições recebidas</h2></div><button id="logoutButton" class="button secondary" type="button">Sair</button></div><div id="applicationList" class="announcement-list"></div><section class="admin-publish"><h2>Publicar comunicado</h2><form id="announcementForm"><label for="announcementTitle">Título</label><input id="announcementTitle" name="title" required maxlength="80"><label for="announcementBody">Mensagem</label><textarea id="announcementBody" name="body" rows="4" required maxlength="500"></textarea><button class="button primary" type="submit">Publicar</button><p id="adminFeedback" class="form-feedback" role="status"></p></form></section></section></main>
<footer class="site-footer"><div class="container footer-inner"><a class="brand footer-brand" href="index.html"><img src="capital-roleplay-wordmark.svg" alt="Capital Roleplay"></a><span>© 2026 Capital Roleplay</span><a href="index.html">Voltar ao site</a></div></footer>
<script>const menu=document.getElementById('menuToggle');const nav=document.getElementById('navigation');menu?.addEventListener('click',()=>{const open=nav.classList.toggle('open');menu.setAttribute('aria-expanded',String(open));});nav?.querySelectorAll('a').forEach(link=>link.addEventListener('click',()=>{nav.classList.remove('open');menu?.setAttribute('aria-expanded','false');}));</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
